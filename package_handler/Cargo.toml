[package]
name = "package_handler"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
futures = "0.3.30"
http = "1.1.0"
libc = "0.2.155"
libp2p = { version = "0.53.2", features = ["tcp", "noise", "yamux", "tokio", "ping", "relay", "macros", "request-response", "rsa", "identify"] }
libp2p-stream = "0.1.0-alpha.1"
pnet = "0.35.0"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "tokio-macros", "macros"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
