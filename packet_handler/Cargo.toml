[package]
name = "packet_handler"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "lib"]
name = "packet_handler"

[dependencies]
anyhow.workspace = true
uniffi = "0.28"
libp2p = { version = "0.53.2", features = ["tcp", "noise", "yamux", "tokio", "ping", "relay", "macros", "request-response", "rsa", "identify"] }
libp2p-stream = "0.1.0-alpha.1"
pnet = "0.35.0"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "tokio-macros", "macros"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "1.0.63"


[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
